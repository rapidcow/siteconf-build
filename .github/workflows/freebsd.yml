name: FreeBSD

on:
  push:
  pull_request:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
    inputs:
      siteconf_ref:
        description: Branch, tag or commit in rapidcow/siteconf
        default: 98222e3e1e6dded286f0854609815167c2f50463
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: rapidcow/siteconf
          ref: ${{ inputs.siteconf_ref || '98222e3e1e6dded286f0854609815167c2f50463' }}
          path: upstream
          persist-credentials: false
      - name: Run package tests on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          cache-after-prepare: true
          copyback: false
          prepare: |
            set -eu
            export PATH="/usr/local/bin:$PATH"
            pkg install -y git ninja gettext-tools curl p5-App-cpanminus
            cpanm --mirror https://cpan.metacpan.org --mirror-only File::Which Locale::Messages URI File::ShareDir File::ShareDir::Install Encode::Locale 'Template~3.103'
          run: |
            set -eu
            export PATH="/usr/local/bin:$PATH"
            git config --global --add safe.directory "$PWD/upstream"
            ninja --version
            ./smoke upstream
