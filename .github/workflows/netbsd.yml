name: NetBSD

on:
  push:
  pull_request:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
    inputs:
      siteconf_ref:
        description: Branch, tag or commit in rapidcow/siteconf
        default: master
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: rapidcow/siteconf
          ref: ${{ inputs.siteconf_ref || 'master' }}
          path: upstream
          persist-credentials: false
      - name: Run package tests on NetBSD
        uses: vmactions/netbsd-vm@v1
        with:
          cache-after-prepare: true
          copyback: false
          prepare: |
            set -eu
            export PATH="/usr/pkg/bin:$PATH"
            /usr/sbin/pkg_add -u git-base ninja-build gettext-tools curl p5-App-cpanminus
            cpanm --mirror https://cpan.metacpan.org --mirror-only File::Which Locale::Messages URI File::ShareDir File::ShareDir::Install Encode::Locale 'Template~3.103'
          run: |
            set -eu
            export PATH="/usr/pkg/bin:$PATH"
            git config --global --add safe.directory "$PWD/upstream"
            ninja --version
            ./smoke upstream
